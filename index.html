
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="main">
        <section class="container">
            <img
                class="hero-image"
                src="./images/illustration-hero.svg"
                alt="Person enjoying music with headphones"
            >

            <div class="content">
                <h1 class="heading">Order Summary</h1>

                <p class="summary-para">
                    You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
                </p>

                <div class="plan-box">
                    <img src="./images/icon-music.svg" alt="" class="music-icon">

                    <div class="plan-text">
                        <h3>Annual Plan</h3>
                        <p>$59.99/year</p>
                    </div>

                    <div class="change-link">
                        <a href="#">Change</a>
                    </div>
                </div>

                <button class="proceed-btn" type="button">
                    Proceed to Payment
                </button>

                <a href="#" class="cancel-order">Cancel Order</a>
            </div>
        </section>

        <footer class="attribution">
            Challenge by <a href="https://www.crio.do" target="_blank" rel="noopener">Crio</a>.
            Coded by <a href="https://www.github.com/sarthakj7792" target="_blank" rel="noopener">Sarthak Sethi</a>.
        </footer>
    </main>
</body>
</html>
